# Corpus subset m1: MySQL errors (docs/08-milestones.md M1 criterion 2,
# docs/09-conventions.md section 4). checked against MySQL 8.0.46 on 2026-11-24 (ADR 0002 addendum).

fixtures:
  shop: &shop
    - CREATE TABLE items (id INTEGER PRIMARY KEY AUTO_INCREMENT, name VARCHAR(20) NOT NULL, price DECIMAL(10,2), added DATE, note TEXT)
    - CREATE TABLE tags (id INTEGER PRIMARY KEY AUTO_INCREMENT, code VARCHAR(10) NOT NULL UNIQUE)
    - INSERT INTO items (name, price, added, note) VALUES ('pen', 1.50, '2024-01-02', NULL), ('ink', 10.00, '2024-02-03', 'x'), ('cap', NULL, NULL, 'y')
    - INSERT INTO tags (code) VALUES ('a'), ('b')

cases:
  - id: errors.duplicate-key.001
    tags: [errors, "1062"]
    milestone: m1
    setup: *shop
    sql: INSERT INTO items (id, name) VALUES (1, 'dup')
    expect:
      error: {code: 1062, sqlstate: "23000"}

  - id: errors.duplicate-key.002
    tags: [errors, "1062", unique]
    milestone: m1
    setup: *shop
    sql: INSERT INTO tags (code) VALUES ('c'), ('a')
    expect:
      error: {code: 1062, sqlstate: "23000"}

  - id: errors.duplicate-key.003
    tags: [errors, "1062", unique, update]
    milestone: m1
    setup: *shop
    sql: UPDATE tags SET code = 'a' WHERE code = 'b'
    expect:
      error: {code: 1062, sqlstate: "23000"}

  - id: errors.no-such-table.001
    tags: [errors, "1146"]
    milestone: m1
    setup: *shop
    sql: SELECT * FROM missing
    expect:
      error: {code: 1146, sqlstate: 42S02}

  - id: errors.no-such-table.002
    tags: [errors, "1146", write]
    milestone: m1
    setup: *shop
    sql: DELETE FROM missing
    expect:
      error: {code: 1146, sqlstate: 42S02}

  - id: errors.unknown-column.001
    tags: [errors, "1054"]
    milestone: m1
    setup: *shop
    sql: SELECT nope FROM items
    expect:
      error: {code: 1054, sqlstate: 42S22}

  - id: errors.unknown-column.002
    tags: [errors, "1054", insert]
    milestone: m1
    setup: *shop
    sql: INSERT INTO items (nope) VALUES (1)
    expect:
      error: {code: 1054, sqlstate: 42S22}

  - id: errors.unknown-column.003
    tags: [errors, "1054", update]
    milestone: m1
    setup: *shop
    sql: UPDATE items SET name = 'x' WHERE nope = 1
    expect:
      error: {code: 1054, sqlstate: 42S22}

  - id: errors.unknown-database.001
    tags: [errors, "1049"]
    milestone: m1
    sql: USE nodb
    expect:
      error: {code: 1049, sqlstate: "42000"}

  - id: errors.bad-null.001
    tags: [errors, "1048"]
    milestone: m1
    setup: *shop
    sql: INSERT INTO items (name) VALUES (NULL)
    expect:
      error: {code: 1048, sqlstate: "23000"}

  - id: errors.bad-null.002
    tags: [errors, "1048", update]
    milestone: m1
    setup: *shop
    sql: UPDATE items SET name = NULL WHERE id = 1
    expect:
      error: {code: 1048, sqlstate: "23000"}

  - id: errors.no-default.001
    tags: [errors, "1364", strict]
    milestone: m1
    setup: *shop
    sql: INSERT INTO items (note) VALUES ('x')
    expect:
      error: {code: 1364, sqlstate: HY000}

  - id: errors.column-count.001
    tags: [errors, "1136"]
    milestone: m1
    setup: *shop
    sql: INSERT INTO items (name, note) VALUES ('a')
    expect:
      error: {code: 1136, sqlstate: 21S01}

  - id: errors.field-twice.001
    tags: [errors, "1110"]
    milestone: m1
    setup: *shop
    sql: INSERT INTO items (name, name) VALUES ('a', 'b')
    expect:
      error: {code: 1110, sqlstate: "42000"}

  - id: errors.parse.001
    tags: [errors, "1064"]
    milestone: m1
    sql: SELEC 1
    expect:
      error: {code: 1064, sqlstate: "42000"}
