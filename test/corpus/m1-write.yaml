# Corpus subset m1: INSERT, UPDATE and DELETE with MySQL's affected rows, insert id and
# info string (docs/05-dialect.md section 6). oracle: pending (ADR 0002 addendum).

fixtures:
  shop: &shop
    - CREATE TABLE items (id INTEGER PRIMARY KEY AUTO_INCREMENT, name VARCHAR(20) NOT NULL, price DECIMAL(10,2), added DATE, note TEXT)
    - INSERT INTO items (name, price, added, note) VALUES ('pen', 1.50, '2024-01-02', NULL), ('ink', 10.00, '2024-02-03', 'x'), ('cap', NULL, NULL, 'y')

cases:
  - id: crud.insert.001
    tags: [crud, insert, insert-id]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: INSERT INTO items (name) VALUES ('nib')
    expect:
      affected_rows: 1
      insert_id: 4
      info: ""

  - id: crud.insert.002
    tags: [crud, insert, insert-id, multi-row]
    milestone: m1
    oracle: pending
    setup: *shop
    # The insert id of a multi-row INSERT is the first generated value.
    sql: INSERT INTO items (name) VALUES ('a'), ('b'), ('c')
    expect:
      affected_rows: 3
      insert_id: 4
      info: "Records: 3  Duplicates: 0  Warnings: 0"

  - id: crud.insert.003
    tags: [crud, insert, insert-id]
    milestone: m1
    oracle: pending
    setup: *shop
    # Nothing generated: the explicit value is reported.
    sql: INSERT INTO items (id, name) VALUES (10, 'z')
    expect:
      affected_rows: 1
      insert_id: 10

  - id: crud.insert.004
    tags: [crud, insert, insert-id]
    milestone: m1
    oracle: pending
    setup: *shop
    # Generated values continue after the highest id.
    session: ["INSERT INTO items (id, name) VALUES (10, 'z')"]
    sql: INSERT INTO items SET name = 'after'
    expect:
      affected_rows: 1
      insert_id: 11

  - id: crud.insert.005
    tags: [crud, insert]
    milestone: m1
    oracle: pending
    setup: *shop
    session: ["INSERT INTO items (name, price, added) VALUES ('nib', 2.25, '2024-03-04')"]
    sql: SELECT id, name, price, added, note FROM items WHERE name = 'nib'
    expect:
      rows: [["4", nib, "2.25", "2024-03-04", null]]

  - id: dialect.insert-default-values.001
    tags: [dialect, R006, insert]
    milestone: m1
    oracle: pending
    setup:
      - CREATE TABLE d (id INTEGER PRIMARY KEY AUTO_INCREMENT, note TEXT)
    sql: INSERT INTO d VALUES ()
    expect:
      affected_rows: 1
      insert_id: 1

  - id: crud.update.001
    tags: [crud, update, affected-rows]
    milestone: m1
    oracle: pending
    setup: *shop
    # ink already has 'x': three rows match, two change.
    sql: UPDATE items SET note = 'x'
    expect:
      affected_rows: 2
      info: "Rows matched: 3  Changed: 2  Warnings: 0"

  - id: crud.update.002
    tags: [crud, update, affected-rows, found-rows]
    milestone: m1
    oracle: pending
    setup: *shop
    found_rows: true
    sql: UPDATE items SET note = 'x'
    expect:
      affected_rows: 3
      info: "Rows matched: 3  Changed: 2  Warnings: 0"

  - id: crud.update.003
    tags: [crud, update, affected-rows]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: UPDATE items SET name = 'none' WHERE id = 42
    expect:
      affected_rows: 0
      info: "Rows matched: 0  Changed: 0  Warnings: 0"

  - id: crud.update.004
    tags: [crud, update, affected-rows, collation]
    milestone: m1
    oracle: pending
    setup: *shop
    # A case-only change is a change: MySQL compares the stored bytes.
    sql: UPDATE items SET name = 'PEN' WHERE id = 1
    expect:
      affected_rows: 1
      info: "Rows matched: 1  Changed: 1  Warnings: 0"

  - id: dialect.update-delete-limit.001
    tags: [dialect, R007, update]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: UPDATE items SET note = 'z' ORDER BY id DESC LIMIT 1
    expect:
      affected_rows: 1
      info: "Rows matched: 1  Changed: 1  Warnings: 0"

  - id: dialect.update-delete-limit.002
    tags: [dialect, R007, update]
    milestone: m1
    oracle: pending
    setup: *shop
    session: ["UPDATE items SET note = 'z' ORDER BY id DESC LIMIT 1"]
    sql: SELECT id, note FROM items ORDER BY id
    expect:
      ordered: true
      rows: [["1", null], ["2", x], ["3", z]]

  - id: dialect.update-delete-limit.003
    tags: [dialect, R007, delete]
    milestone: m1
    oracle: pending
    setup: *shop
    session: ["DELETE FROM items ORDER BY id LIMIT 2"]
    sql: SELECT id FROM items
    expect:
      rows: [["3"]]

  - id: crud.delete.001
    tags: [crud, delete, affected-rows]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: DELETE FROM items WHERE price > 5
    expect:
      affected_rows: 1

  - id: crud.delete.002
    tags: [crud, delete, affected-rows]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: DELETE FROM items
    expect:
      affected_rows: 3
