# Corpus subset m3, rules: one positive and one negative case per rule ID of
# internal/dialect/rules.go (docs/07-testing.md section 5 item 2, M3 criterion 1).
# A positive case shows the rule translating a construct; a negative case shows where
# the rule stops: the construct it leaves alone or the MySQL error it keeps.
# internal/corpus TestRuleCoverage checks that every rule ID has both.
# Expectations come from the MySQL 8.0 documentation (oracle: pending, ADR 0002).

fixtures:
  shop: &shop
    - CREATE TABLE items (id INT NOT NULL AUTO_INCREMENT PRIMARY KEY, name VARCHAR(20) NOT NULL, price DECIMAL(10,2), note TEXT)
    - INSERT INTO items (name, price, note) VALUES ('pen', 1.50, NULL), ('ink', 10.00, 'x'), ('cap', NULL, 'y')

cases:
  - id: rule.r001.001
    tags: [rule, R001, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT name FROM items /*!50000 WHERE id = 2 */
    expect:
      rows: [[ink]]

  - id: rule.r001.002
    tags: [rule, R001, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    # Above the server version (8.0.36): the content is a comment.
    sql: SELECT count(*) FROM items /*!90000 WHERE id = 2 */
    expect:
      rows: [["3"]]

  - id: rule.r002.001
    tags: [rule, R002, positive]
    milestone: m3
    oracle: pending
    sql: SELECT 'it''s', 'a\tb'
    expect:
      rows: [["it's", "a\tb"]]

  - id: rule.r002.002
    tags: [rule, R002, negative]
    milestone: m3
    oracle: pending
    session: ["SET sql_mode = 'NO_BACKSLASH_ESCAPES'"]
    # No unescaping under NO_BACKSLASH_ESCAPES: four characters.
    sql: SELECT 'a\tb', CHAR_LENGTH('a\tb')
    expect:
      rows: [['a\tb', "4"]]

  - id: rule.r003.001
    tags: [rule, R003, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT name FROM items WHERE note <=> NULL
    expect:
      rows: [[pen]]

  - id: rule.r003.002
    tags: [rule, R003, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT name FROM items WHERE note = NULL
    expect:
      rows: []

  - id: rule.r004.001
    tags: [rule, R004, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT {{db}}.items.name FROM {{db}}.items WHERE id = 3
    expect:
      rows: [[cap]]

  - id: rule.r004.002
    tags: [rule, R004, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT name FROM no_such_db.items
    expect:
      error: {code: 1146, sqlstate: 42S02}
    known_deviation:
      reason: mysqlite reports 1049 Unknown database; MySQL 8.0 is expected to report 1146 for a table in a missing database (oracle pending)
      ref: docs/agent-notes/discrepancies.md

  - id: rule.r005.001
    tags: [rule, R005, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT id FROM items ORDER BY id LIMIT 1, 18446744073709551615
    expect:
      ordered: true
      rows: [["2"], ["3"]]

  - id: rule.r005.002
    tags: [rule, R005, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT id FROM items LIMIT -1
    expect:
      error: {code: 1064, sqlstate: "42000"}

  - id: rule.r006.001
    tags: [rule, R006, positive]
    milestone: m3
    oracle: pending
    setup:
      - CREATE TABLE log (id INT NOT NULL AUTO_INCREMENT PRIMARY KEY, msg VARCHAR(10) DEFAULT 'hi')
    sql: INSERT INTO log VALUES ()
    expect:
      affected_rows: 1
      insert_id: 1

  - id: rule.r006.002
    tags: [rule, R006, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    # name is NOT NULL without a default: strict mode refuses the empty row.
    sql: INSERT INTO items VALUES ()
    expect:
      error: {code: 1364, sqlstate: HY000}

  - id: rule.r007.001
    tags: [rule, R007, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: UPDATE items SET note = 'z' ORDER BY id DESC LIMIT 1
    expect:
      affected_rows: 1
      info: "Rows matched: 1  Changed: 1  Warnings: 0"

  - id: rule.r007.002
    tags: [rule, R007, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    # UPDATE and DELETE take a row count, not an offset.
    sql: DELETE FROM items ORDER BY id LIMIT 1, 1
    expect:
      error: {code: 1064, sqlstate: "42000"}

  - id: rule.r008.001
    tags: [rule, R008, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT /*+ NO_INDEX_MERGE(items) */ SQL_NO_CACHE name FROM items FORCE INDEX (PRIMARY) WHERE id = 1
    expect:
      rows: [[pen]]

  - id: rule.r008.002
    tags: [rule, R008, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    # An index hint naming a missing index is an error, not a dropped hint.
    sql: SELECT name FROM items USE INDEX (no_such_key) WHERE id = 1
    expect:
      error: {code: 1176, sqlstate: "42000"}

  - id: rule.r009.001
    tags: [rule, R009, positive]
    milestone: m3
    oracle: pending
    setup:
      - CREATE TABLE t (a TINYINT UNSIGNED, b VARCHAR(3))
    sql: INSERT INTO t VALUES (255, 'abc')
    expect:
      affected_rows: 1

  - id: rule.r009.002
    tags: [rule, R009, negative]
    milestone: m3
    oracle: pending
    setup:
      - CREATE TABLE t (a TINYINT UNSIGNED, b VARCHAR(3))
    sql: INSERT INTO t VALUES (256, 'abc')
    expect:
      error: {code: 1264, sqlstate: "22003"}

  - id: rule.r010.001
    tags: [rule, R010, positive]
    milestone: m3
    oracle: pending
    setup:
      - CREATE TABLE u (id INT, code VARCHAR(5), UNIQUE KEY uc (code))
      - INSERT INTO u VALUES (1, 'a')
    sql: INSERT INTO u VALUES (2, 'A')
    expect:
      error: {code: 1062, sqlstate: "23000"}

  - id: rule.r010.002
    tags: [rule, R010, negative]
    milestone: m3
    oracle: pending
    sql: CREATE TABLE v (a INT, b INT, KEY k (a), KEY k (b))
    expect:
      error: {code: 1061, sqlstate: "42000"}

  - id: rule.r011.001
    tags: [rule, R011, positive]
    milestone: m3
    oracle: pending
    sql: SELECT DATABASE() = '{{db}}', SCHEMA() = '{{db}}'
    expect:
      rows: [["1", "1"]]

  - id: rule.r011.002
    tags: [rule, R011, negative]
    milestone: m3
    oracle: pending
    setup:
      - CREATE TABLE d (`database` VARCHAR(5))
      - INSERT INTO d VALUES ('col')
    # A column named database is a column, not the function.
    sql: SELECT `database` FROM d
    expect:
      rows: [[col]]

  - id: rule.r012.001
    tags: [rule, R012, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT CONCAT(name, '-', price), IFNULL(note, 'none'), UPPER(name) FROM items WHERE id = 1
    expect:
      rows: [[pen-1.50, none, PEN]]

  - id: rule.r012.002
    tags: [rule, R012, negative]
    milestone: m3
    oracle: pending
    # The function table checks the argument count.
    sql: SELECT UPPER('a', 'b')
    expect:
      error: {code: 1582, sqlstate: "42000"}

  - id: rule.r012.003
    tags: [rule, R012, negative]
    milestone: m3
    oracle: pending
    sql: SELECT no_such_function(1)
    expect:
      error: {code: 1305, sqlstate: "42000"}
    known_deviation:
      reason: mysqlite does not tell an unknown function from a MySQL function it does not implement and reports 1235 for both
      ref: docs/agent-notes/discrepancies.md

  - id: rule.r013.001
    tags: [rule, R013, positive]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT name FROM items WHERE id = ANY (SELECT id FROM items WHERE price > 5)
    expect:
      rows: [[ink]]

  - id: rule.r013.002
    tags: [rule, R013, negative]
    milestone: m3
    oracle: pending
    setup: *shop
    sql: SELECT (SELECT id FROM items)
    expect:
      error: {code: 1242, sqlstate: "21000"}
