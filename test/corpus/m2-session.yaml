# Corpus subset m2: session variables, diagnostics, server SHOW and CREATE TABLE
# (docs/08-milestones.md M2, docs/04-session-catalog.md sections 1 and 4,
# docs/05-dialect.md section 7). Fixtures run through the MySQL protocol.
# checked against MySQL 8.0.46 on 2026-11-24 (ADR 0002 addendum).

fixtures:
  shop: &shop
    - CREATE TABLE items (id INT NOT NULL AUTO_INCREMENT PRIMARY KEY, name VARCHAR(5) NOT NULL, qty TINYINT NOT NULL DEFAULT 1)

cases:
  - id: session.set.001
    tags: [set, variables]
    milestone: m2
    setup: *shop
    session: ["SET autocommit = 0"]
    sql: SELECT @@autocommit, @@session.autocommit, @@global.autocommit
    expect:
      rows: [["0", "0", "1"]]

  - id: session.set.002
    tags: [set, errors, "1193"]
    milestone: m2
    setup: *shop
    sql: SET no_such_variable = 1
    expect:
      error: {code: 1193, sqlstate: HY000}

  - id: session.set.003
    tags: [set, errors, "1238"]
    milestone: m2
    setup: *shop
    sql: SET version = 'x'
    expect:
      error: {code: 1238, sqlstate: HY000}

  - id: session.set.004
    tags: [set, errors, "1231"]
    milestone: m2
    setup: *shop
    sql: SET sql_mode = 'NO_SUCH_MODE'
    expect:
      error: {code: 1231, sqlstate: "42000"}

  - id: session.set.005
    tags: [set, sql_mode]
    milestone: m2
    setup: *shop
    session: ["SET sql_mode = 'ansi_quotes,strict_trans_tables'"]
    sql: SELECT @@sql_mode
    expect:
      rows: [["ANSI_QUOTES,STRICT_TRANS_TABLES"]]

  - id: session.set.006
    tags: [set, names]
    milestone: m2
    setup: *shop
    session: ["SET NAMES utf8mb4 COLLATE utf8mb4_bin"]
    sql: SELECT @@character_set_client, @@character_set_results, @@collation_connection
    expect:
      rows: [[utf8mb4, utf8mb4, utf8mb4_bin]]

  - id: session.warnings.001
    tags: [warnings, "1292"]
    milestone: m2
    setup: *shop
    session: ["SET wait_timeout = 0"]
    sql: SHOW WARNINGS
    expect:
      columns: [Level, Code, Message]
      types: [VAR_STRING, LONG, VAR_STRING]
      rows: [[Warning, "1292", "Truncated incorrect wait_timeout value: '0'"]]
    known_deviation:
      reason: mysqlite adds a 1235 Warning for a variable it stores but does not apply
      ref: docs/agent-notes/discrepancies.md

  - id: session.warnings.002
    tags: [warnings, errors]
    milestone: m2
    setup: *shop
    session: ["SELECT 1"]
    sql: SHOW COUNT(*) WARNINGS
    expect:
      columns: ["@@session.warning_count"]
      rows: [["0"]]

  - id: session.warnings.003
    tags: [warnings, errors]
    milestone: m2
    setup: *shop
    sql: SHOW ERRORS
    expect:
      rows: []

  - id: session.show-variables.001
    tags: [show, variables]
    milestone: m2
    setup: *shop
    sql: SHOW VARIABLES LIKE 'auto\_increment\_%'
    expect:
      columns: [Variable_name, Value]
      rows: [[auto_increment_increment, "1"], [auto_increment_offset, "1"]]
      ordered: true

  - id: session.show-variables.002
    tags: [show, variables, where]
    milestone: m2
    setup: *shop
    session: ["SET autocommit = 0"]
    sql: SHOW SESSION VARIABLES WHERE Variable_name = 'autocommit'
    expect:
      rows: [[autocommit, "OFF"]]

  - id: session.show-collation.001
    tags: [show, collation]
    milestone: m2
    setup: *shop
    sql: SHOW COLLATION WHERE Collation IN ('utf8mb4_bin', 'utf8mb4_general_ci')
    expect:
      columns: [Collation, Charset, Id, Default, Compiled, Sortlen, Pad_attribute]
      rows:
        - [utf8mb4_bin, utf8mb4, "46", "", "Yes", "1", PAD SPACE]
        - [utf8mb4_general_ci, utf8mb4, "45", "", "Yes", "1", PAD SPACE]
    known_deviation:
      reason: utf8mb4_general_ci is the default collation of utf8mb4 in mysqlite (Default = Yes); MySQL 8.0's default is utf8mb4_0900_ai_ci
      ref: docs/agent-notes/discrepancies.md

  - id: session.show-charset.001
    tags: [show, charset]
    milestone: m2
    setup: *shop
    sql: SHOW CHARACTER SET WHERE Charset = 'utf8mb3'
    expect:
      columns: [Charset, Description, Default collation, Maxlen]
      rows: [[utf8mb3, "UTF-8 Unicode", utf8mb3_general_ci, "3"]]

  - id: ddl.create-table.001
    tags: [ddl, defaults]
    milestone: m2
    setup: *shop
    session: ["INSERT INTO items (name) VALUES ('a')"]
    sql: SELECT id, name, qty FROM items
    expect:
      rows: [["1", a, "1"]]

  - id: ddl.create-table.002
    tags: [ddl, errors, "1050"]
    milestone: m2
    setup: *shop
    sql: CREATE TABLE items (a INT)
    expect:
      error: {code: 1050, sqlstate: 42S01}

  - id: ddl.create-table.003
    tags: [ddl, errors, "1075"]
    milestone: m2
    setup: *shop
    sql: CREATE TABLE t (a INT AUTO_INCREMENT)
    expect:
      error: {code: 1075, sqlstate: "42000"}

  - id: ddl.create-table.004
    tags: [ddl, errors, "1067"]
    milestone: m2
    setup: *shop
    sql: CREATE TABLE t (a TINYINT DEFAULT 300)
    expect:
      error: {code: 1067, sqlstate: "42000"}

  - id: ddl.create-table.005
    tags: [ddl, errors, "1406"]
    milestone: m2
    setup: *shop
    sql: INSERT INTO items (name) VALUES ('toolong')
    expect:
      error: {code: 1406, sqlstate: "22001"}

  - id: ddl.create-table.006
    tags: [ddl, errors, "1264"]
    milestone: m2
    setup: *shop
    sql: INSERT INTO items (name, qty) VALUES ('a', 1), ('b', -129)
    expect:
      error: {code: 1264, sqlstate: "22003"}

  - id: ddl.create-table.007
    tags: [ddl, if-not-exists]
    milestone: m2
    setup: *shop
    session: ["CREATE TABLE IF NOT EXISTS items (a INT)"]
    sql: SHOW WARNINGS
    expect:
      rows: [[Note, "1050", "Table 'items' already exists"]]
