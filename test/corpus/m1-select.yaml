# Corpus subset m1: single-table SELECT and the lexical rules of docs/05-dialect.md
# section 3. Expectations come from the MySQL 8.0 documentation (oracle: pending,
# ADR 0002 addendum) until mysql-ref runs them.
#
# Fixtures are written in the SQL both engines accept (internal/corpus.SQLiteFixture).

fixtures:
  shop: &shop
    - CREATE TABLE items (id INTEGER PRIMARY KEY AUTO_INCREMENT, name VARCHAR(20) NOT NULL, price DECIMAL(10,2), added DATE, note TEXT)
    - INSERT INTO items (name, price, added, note) VALUES ('pen', 1.50, '2024-01-02', NULL), ('ink', 10.00, '2024-02-03', 'x'), ('cap', NULL, NULL, 'y')

cases:
  - id: crud.select.001
    tags: [crud, select, types]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT id, name FROM items ORDER BY id
    expect:
      columns: [id, name]
      types: [LONG, VAR_STRING]
      ordered: true
      rows: [["1", pen], ["2", ink], ["3", cap]]

  - id: crud.select.002
    tags: [crud, select, types, decimal, date]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT price, added, note FROM items WHERE id = 1
    expect:
      columns: [price, added, note]
      types: [NEWDECIMAL, DATE, BLOB]
      rows: [["1.50", "2024-01-02", null]]

  - id: crud.select.003
    tags: [crud, select, null]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT name, price, added FROM items WHERE price IS NULL
    expect:
      rows: [[cap, null, null]]

  - id: crud.select.004
    tags: [crud, select, star]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT * FROM items WHERE id = 2
    expect:
      columns: [id, name, price, added, note]
      types: [LONG, VAR_STRING, NEWDECIMAL, DATE, BLOB]
      rows: [["2", ink, "10.00", "2024-02-03", x]]

  - id: crud.select.005
    tags: [crud, select, alias]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT name AS n FROM items ORDER BY n
    expect:
      columns: [n]
      ordered: true
      rows: [[cap], [ink], [pen]]

  - id: crud.select.006
    tags: [crud, select, alias, error]
    milestone: m1
    oracle: pending
    setup: *shop
    # A select alias is not visible in WHERE; SQLite would resolve it.
    sql: SELECT name AS n FROM items WHERE n = 'pen'
    expect:
      error: {code: 1054, sqlstate: 42S22}

  - id: crud.select.007
    tags: [crud, select, scalar, types]
    milestone: m1
    oracle: pending
    sql: SELECT 1
    expect:
      columns: ["1"]
      types: [LONGLONG]
      rows: [["1"]]

  - id: crud.select.008
    tags: [crud, select, empty]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT id FROM items WHERE id > 100
    expect:
      columns: [id]
      rows: []

  - id: dialect.version-comment.001
    tags: [dialect, R001]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT name FROM items /*!50000 WHERE id = 2 */
    expect:
      rows: [[ink]]

  - id: dialect.version-comment.002
    tags: [dialect, R001]
    milestone: m1
    oracle: pending
    setup: *shop
    # Above the server version (8.0.36): skipped.
    sql: SELECT name FROM items /*!99999 WHERE id = 2 */
    expect:
      rows: [[pen], [ink], [cap]]

  - id: dialect.string-literal.001
    tags: [dialect, R002, lexical]
    milestone: m1
    oracle: pending
    sql: SELECT 'it''s'
    expect:
      rows: [["it's"]]

  - id: dialect.string-literal.002
    tags: [dialect, R002, lexical]
    milestone: m1
    oracle: pending
    # MySQL unescapes backslash sequences; SQLite would keep both characters.
    sql: 'SELECT ''a\\b'', ''tab\there'''
    expect:
      rows: [['a\b', "tab\there"]]

  - id: dialect.string-literal.003
    tags: [dialect, R002, lexical]
    milestone: m1
    oracle: pending
    setup: *shop
    # Adjacent literals are one string.
    sql: SELECT id FROM items WHERE name = 'p' 'en'
    expect:
      rows: [["1"]]

  - id: dialect.null-safe-equal.001
    tags: [dialect, R003, null]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT name FROM items WHERE note <=> NULL
    expect:
      rows: [[pen]]

  - id: dialect.null-safe-equal.002
    tags: [dialect, R003, null]
    milestone: m1
    oracle: pending
    setup: *shop
    # Without <=>, a comparison with NULL matches nothing.
    sql: SELECT name FROM items WHERE note = NULL
    expect:
      rows: []

  - id: dialect.database-qualifier.001
    tags: [dialect, R004]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT `items`.`name` FROM {{db}}.items WHERE {{db}}.items.id = 1
    expect:
      columns: [name]
      rows: [[pen]]

  - id: dialect.database-qualifier.002
    tags: [dialect, R004, write]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: UPDATE {{db}}.items SET name = 'nib' WHERE id = 1
    expect:
      affected_rows: 1

  - id: dialect.limit-offset.001
    tags: [dialect, R005, limit]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT id FROM items ORDER BY id LIMIT 1, 1
    expect:
      rows: [["2"]]

  - id: dialect.limit-offset.002
    tags: [dialect, R005, limit]
    milestone: m1
    oracle: pending
    setup: *shop
    # The documented idiom for "all rows from an offset".
    sql: SELECT id FROM items ORDER BY id LIMIT 1, 18446744073709551615
    expect:
      ordered: true
      rows: [["2"], ["3"]]

  - id: dialect.limit-offset.003
    tags: [dialect, R005, limit]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT id FROM items ORDER BY id DESC LIMIT 2 OFFSET 1
    expect:
      ordered: true
      rows: [["2"], ["1"]]

  - id: dialect.hint-strip.001
    tags: [dialect, R008]
    milestone: m1
    oracle: pending
    setup: *shop
    sql: SELECT /*+ MAX_EXECUTION_TIME(1000) */ HIGH_PRIORITY name FROM items USE INDEX (PRIMARY) WHERE id = 1
    expect:
      rows: [[pen]]
